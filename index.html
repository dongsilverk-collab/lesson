<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c2024;--sub:#6b7178;--line:#e6e3da;--mint:#13b89c;--mint-d:#0e9a82;--mint-l:#e6f7f2;--navy:#26324f;--amber:#b9821b;--rose:#c2453b;--grn:#0f7e6c;--grn-l:#e6f5ef;--orange:#b5532a;--orange-l:#fbeee6;--shadow:0 1px 2px rgba(20,30,40,.04),0 8px 24px rgba(20,30,40,.06);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint),var(--mint-d));display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:var(--shadow)}
h1{font-size:20px;margin:0;letter-spacing:-.02em}.sub{color:var(--sub);font-size:13px}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow)}
.ctl label{font-size:12px;color:var(--sub);font-weight:700}
.ctl select{border:none;font-weight:700;font-size:14px;background:none;outline:none;font-family:inherit}
.ctl button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#faf9f5;cursor:pointer;font-weight:700;font-size:15px;line-height:1}
.ctl b{min-width:30px;text-align:center}
.htabs{padding:4px !important}
.htabs{flex:0 0 auto !important}
.htabs button{border:none;background:none;padding:6px 14px;border-radius:7px;font-family:inherit;font-weight:700;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap;min-width:42px;line-height:1.2}
.htabs button.on{background:var(--mint);color:#fff}
.layout{display:grid;grid-template-columns:262px 1fr;gap:16px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.roster{padding:12px;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 30px);overflow:auto}
.roster h2{font-size:13px;color:var(--sub);margin:2px 4px 8px;font-weight:700;display:flex;justify-content:space-between}
.stu{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.stu:hover{background:#faf9f5}.stu.active{background:var(--mint-l);border-color:#bfe9df}
.stu .nm{font-weight:600;font-size:14px}.stu .tg{margin-left:auto;font-size:11px;color:var(--sub);background:#f0eee8;border-radius:6px;padding:2px 6px}
.stu .multi{font-size:10px;color:var(--orange);font-weight:700}
.rosterfoot{margin-top:10px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.rosterfoot b{display:block;font-size:16px;color:var(--grn);margin-top:2px}
.add{width:100%;margin-top:8px;padding:9px;border:1px dashed #c9c6bc;border-radius:10px;background:none;color:var(--mint-d);font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.add:hover{background:var(--mint-l)}
.editor{padding:16px 18px}.empty{padding:50px 20px;text-align:center;color:var(--sub)}
.idrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.sname{font-size:18px;font-weight:800}
.sbadge{font-size:11px;background:var(--orange-l);color:var(--orange);border-radius:7px;padding:3px 8px;font-weight:700}
.tabs{display:inline-flex;background:#f0eee8;border-radius:10px;padding:3px;margin:12px 0 14px}
.tab{border:none;background:none;padding:7px 16px;border-radius:8px;font-family:inherit;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}.tab small{display:block;font-weight:500;font-size:10px;color:var(--sub)}
.grp-h{font-size:11px;font-weight:800;color:var(--mint-d);margin:6px 2px 8px}.grp-h.addh{color:var(--navy);margin:16px 2px 8px}.grp-h.carryh{color:var(--orange);margin:16px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:9px}
.cell{border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center;background:#fff}
.cell .lab{font-size:11.5px;font-weight:600}.cell .pr{font-size:10px;color:var(--sub);margin-bottom:5px}
.step{display:flex;align-items:center;justify-content:center;gap:6px}
.step button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#faf9f5;font-size:16px;cursor:pointer;font-weight:700;line-height:1;display:grid;place-items:center}
.step button:hover{background:var(--mint-l);border-color:#bfe9df}
.step input{width:40px;text-align:center;padding:5px 2px;font-weight:700;-moz-appearance:textfield;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell.has{border-color:#bfe9df;background:var(--mint-l)}.cell.has .step input{color:var(--mint-d)}
.carry .cell.has{border-color:#e7b58a;background:var(--orange-l)}.carry .cell.has .step input{color:var(--orange)}
.carrybox{margin-top:10px;background:var(--orange-l);border:1px solid #eccfb4;border-radius:11px;padding:10px 14px;font-size:13px;color:#7a4a22;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.carrybox b{font-size:15px}
.wonrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:10px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.memo{margin-top:10px}
input.txt,select.txt{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
.field label{font-size:11px;color:var(--sub);font-weight:700;padding-left:2px;display:block;margin-bottom:4px}
.totbar{position:sticky;bottom:0;margin-top:16px;background:linear-gradient(180deg,rgba(246,244,239,0),var(--bg) 40%);padding-top:8px}
.tot{display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-radius:14px;padding:13px 18px;box-shadow:var(--shadow);color:#fff}
.tot.pay{background:var(--grn)}.tot.bill{background:var(--navy)}
.tot .t{display:flex;flex-direction:column}.tot .t b{font-size:17px}.tot .t span{font-size:11px;opacity:.75}
.tot .grand b{font-size:25px}.tot.pay .grand b{color:#bdf5e2}.tot.bill .grand b{color:#7ef0d8}
.tot .actions{margin-left:auto;display:flex;gap:8px}
.btn{border:none;border-radius:10px;padding:10px 14px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}.btn.ghost:hover{background:rgba(255,255,255,.26)}
.btn.mint{background:var(--mint);color:#fff}.btn.mint:hover{background:var(--mint-d)}
.msgbox{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:#3a4148;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2024;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
.warn{font-size:12px;font-weight:700;margin-left:6px;color:#ffe2a6}
.del{background:none;border:none;color:var(--rose);font-weight:700;cursor:pointer;font-size:12px;margin-left:auto}
.ref{font-size:11px;color:var(--sub);margin-top:8px}.ref summary{font-weight:700;cursor:pointer}.ref table{border-collapse:collapse;margin-top:6px}.ref td{border:1px solid var(--line);padding:2px 7px}

/* ===== 모바일 ===== */
.mobnav{display:none}
@media(max-width:800px){
  .ctl.htabs{flex:0 0 auto !important}
  .htabs button{padding:7px 16px;font-size:14px}
  .wrap{padding:calc(12px + env(safe-area-inset-top)) 12px calc(76px + env(safe-area-inset-bottom))}
  header{gap:8px}
  h1{font-size:18px}.sub{display:none}
  .controls{width:100%;margin-left:0}
  .ctl{flex:1;justify-content:center}
  .layout{display:block}
  .roster{position:static;max-height:none;border-radius:14px}
  /* 폰: 학생/입력 화면 전환 */
  body.view-edit .roster{display:none}
  body.view-list .editor{display:none}
  .roster{margin-bottom:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .step button{width:34px;height:34px;font-size:19px}
  .step input{width:46px;height:34px;font-size:16px}
  .cell{padding:9px 7px}
  .tot{flex-direction:column;align-items:stretch;gap:10px;padding:14px}
  .tot .t{flex-direction:row;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:8px}
  .tot .t span{order:-1}
  .tot .grand{border-bottom:none}
  .tot .grand b{font-size:28px}
  .tot .actions{margin-left:0;flex-direction:column}
  .tot .actions .btn{width:100%}
  .totbar{position:static}
  .stu{padding:12px 12px}
  .stu .nm{font-size:15px}
  .tabs{width:100%}.tab{flex:1}
  .dates{grid-template-columns:1fr}
  .editor{border-radius:14px;margin-top:12px}
  .backbtn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--mint-d);font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;margin-bottom:6px;padding:4px 0}
  /* 하단 탭바 */
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(20,30,40,.06);padding-bottom:env(safe-area-inset-bottom)}
  .mobnav button{flex:1;border:none;background:none;padding:9px 4px 11px;font-family:inherit;cursor:pointer;color:var(--sub);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}

   1) 아래 API_URL 에 Apps Script 배포 URL(.../exec)을 붙여넣으세요.
   2) API_TOKEN 은 Apps Script 의 TOKEN 과 똑같이 맞추세요.
   URL 이 비어 있으면 이 기기(localStorage)에만 저장됩니다. */
const API_URL="https://script.google.com/macros/s/AKfycbyVk8_AW8B8DHc7TTIUvidt3T3KgMbYM2f7-FVHt8L2dhGqKSHtTYBQsR-SXlx5HvP4gQ/exec";                 // 예: https://script.google.com/macros/s/AKfy.../exec
const API_TOKEN="이촌2026";       // Apps Script TOKEN 과 동일하게

let lastSynced={};                // 서버와 마지막으로 맞춘 버킷 상태
let pushTimer=null;
function setSync(t){const el=document.getElementById('syncStat');if(el)el.textContent=t;}
async function api(payload){
  payload.token=API_TOKEN;
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  return await res.json();
}
// 선생님 1명분 데이터 묶기 (store 키: 이름|선생님|월, okepay 키: 선생님|월)
function bucketTeacher(T){
  const st={};Object.keys(store).forEach(k=>{if(k.split('|')[1]===T)st[k]=store[k];});
  const op={};Object.keys(okepay).forEach(k=>{if(k.split('|')[0]===T)op[k]=okepay[k];});
  return {store:st,okepay:op};
}
function bucketsNow(){
  const out={};
  TEACHERS.forEach(T=>{out['t:'+T]=JSON.stringify(bucketTeacher(T));});
  out['custom']=JSON.stringify(custom);
  return out;
}
function applyCloud(data){
  store={};okepay={};custom=[];
  Object.keys(data).forEach(key=>{
    const v=data[key];if(v==null||v==='')return;
    if(key==='custom'){try{custom=JSON.parse(v)||[];}catch(e){}}
    else if(key.indexOf('t:')===0){try{const o=JSON.parse(v);Object.assign(store,o.store||{});Object.assign(okepay,o.okepay||{});}catch(e){}}
  });
}
async function cloudLoad(){
  if(!API_URL){setSync('이 기기 저장');return;}
  setSync('불러오는 중…');
  try{
    const res=await api({action:'load'});
    if(res&&res.ok){
      const data=res.data||{};
      if(Object.keys(data).length){
        applyCloud(data);
        if(!isAdmin())curTeacher=currentRole;
        lastSynced=bucketsNow();         // 서버와 동일 상태로 기준 맞춤
        save();render();
        setSync('동기화됨 ✓');
      }else{
        // 시트가 비어 있으면 지금 로컬 데이터를 시드로 업로드
        lastSynced={};
        await cloudPush(true);
      }
    }else{setSync('연결 실패 · 로컬 사용');}
  }catch(e){setSync('오프라인 · 로컬 사용');}
}
function schedulePush(){if(!API_URL)return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>cloudPush(),900);}
async function cloudPush(force){
  if(!API_URL)return;
  const now=bucketsNow();const updates={};
  Object.keys(now).forEach(k=>{if(force||now[k]!==lastSynced[k])updates[k]=now[k];});
  if(!Object.keys(updates).length){setSync('동기화됨 ✓');return;}
  setSync('저장 중…');
  try{
    const res=await api({action:'save',updates});
    if(res&&res.ok){Object.keys(updates).forEach(k=>lastSynced[k]=updates[k]);setSync('저장됨 ✓');}
    else setSync('저장 실패');
  }catch(e){setSync('저장 실패 · 로컬엔 보관');}
}

  return '<div class="cal" onclick="event.stopPropagation()"><div class="calhead"><b>'+YEAR+'년 '+mon+'월</b><button onclick="event.stopPropagation();dpToggleCal(\''+field+'\')">&times;</button></div>'+
    '<div class="caldow">'+dow+'</div><div class="calgrid">'+cells+'</div>'+
    '<div class="calfoot"><small>여러 날짜 탭하면 추가됨</small><button onclick="event.stopPropagation();dpToggleCal(\''+field+'\')">완료</button></div></div>';}
function dateFieldHTML(field,label,mon){return '<div class="field datepick"><label>'+label+'</label>'+chipsHTML(field,ent(curStudent,curTeacher,activeMonth()))+(calOpen&&calOpen.field===field?calHTML(field,mon):'')+'</div>';}

function copyText(t,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>fb(t,msg));}else fb(t,msg);}
function fb(t,msg){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg);}catch(e){toast('복사 실패');}document.body.removeChild(ta);}
// 원장용: 학생별 1행 (모든 담당쌤 합산), 실제 6월 시트 52열
const SHEET_COLS=['학생명','최종납부','바이올린 선생님','개인 60분','개인 40분','개인 30분','개인 20분','고급 60분','전공1','전공2','합주','2만원합주','3만원합주','특강1-3','특강4-6','특강고급','지난달 추가 60분','추가 40분','추가 30분','추가 20분','고급추가60분','전공1추가','전공2추가','추가합주','추가2만원합주','추가3만원합주','특강1-3추가','특강4-6추가','특강고급추가','지난달 결석_60분','결석_40분','결석_30분','결석_20분','결석_고급','전공1결석','전공2결석','결석_합주','결석_2만원합주','결석_3만원합주','결석특강1-3','결석특강4-6','결석특강고급','이월 금액','기본 레슨비','오케스트라','책값','지난달 연주비','연습실','지난달 기본레슨비','지난달 총 레슨비','총레슨비-지난달 기본','확인'];
function adminRows(){const rows=[SHEET_COLS.join('\t')];
  allRoster().forEach(s=>{const ts=s.teachers;if(!ts.length)return;
    // 합산
    const sum={};TYPES.forEach(t=>sum[t.id]=0);const ext={},abs={};CARRY.forEach(x=>{ext[x.id]=0;abs[x.id]=0;});let book=0,carry=0,base=0;let any=false;
    ts.forEach(t=>{const b=ent(s.name,t,billMonth),p=ent(s.name,t,prevMonth());
      TYPES.forEach(x=>{if(b.counts[x.id]){sum[x.id]+=b.counts[x.id];any=true;}});
      CARRY.forEach(x=>{ext[x.id]+=(p.extra[x.id]||0);abs[x.id]+=(p.absent[x.id]||0);if(p.extra[x.id]||p.absent[x.id])any=true;});
      book+=b.book||0;carry+=carryTS(s.name,t);const L=lessons(b);base+=L.base;});
    if(!any&&!book)return;
    const tnames=ts.join('+');
    const C=k=>sum[k]||'';const E=k=>ext[k]||'';const A=k=>abs[k]||'';
    rows.push([s.name, billOf(s.name), tnames,
      C('p60'),C('p40'),C('p30'),C('p20'),C('go'),'','',C('hap'),C('h1'),C('h2'),C('tk3'),C('tk4'),'',
      E('p60'),E('p40'),E('p30'),E('p20'),'','','',E('hap'),E('h1'),E('h2'),'','','',
      A('p60'),A('p40'),A('p30'),A('p20'),'','','',A('hap'),A('h1'),A('h2'),'','','',
      carry||'',base,C('oke'),book||'',C('jubi'),C('yeon'),'','','',''].join('\t'));});
  return rows.join('\n');}
function copyAdmin(){copyText(adminRows(),billMonth+'월 전체 정산표(원장) 복사됨');}

function detailText(name,t,mn){const m=ent(name,t,mn);const parts=[];
  TYPES.forEach(x=>{const n=m.counts[x.id]||0;if(n)parts.push(x.lab+' '+n+(x.id==='yeon'?'시간':'회'));});
  if(m.book)parts.push('책값 '+fmt(m.book)+'원');
  return parts.join(', ')||'-';}
function carryNoteFull(name,t){const p=ent(name,t,prevMonth());const cv=carryTS(name,t);const dets=[];CARRY.forEach(x=>{const ab=p.absent[x.id]||0,ex=p.extra[x.id]||0;if(ab)dets.push(x.lab+' '+ab+'회 결석');if(ex)dets.push(x.lab+' '+ex+'회 추가');});if(!cv&&!dets.length)return'';return ' <span style="color:#b5532a">/ 이월 '+wonKor(cv)+(dets.length?' ('+dets.join(', ')+')':'')+'</span>';}
function pdfSection(t,mn,mode,extra){extra=extra||0;const list=studentsOf(t);const rows=[];let total=0;const isPay=(mode==='pay');const showAmt=isPay;
  list.forEach(nm=>{const L=lessons(ent(nm,t,mn));const cv=carryTS(nm,t);const detail=detailText(nm,t,mn);const mm=ent(nm,t,mn);
    let amt;if(isPay){amt=Math.round(L.base*RATE);}else{amt=L.personal+L.ensemble+L.other+cv+prevOkeYeon(nm,t);}
    if(detail==='-'&&!amt&&!cv&&!mm.memo&&!mm.dateP&&!mm.dateH&&!(mode==='bill'&&prevOkeYeon(nm,t)))return;total+=amt;
    const others=teachersOf(nm).filter(x=>x!==t);
    let cell=detail+(mode==='bill'?carryNoteFull(nm,t):'');
    if(mode==='bill'){const pp=ent(nm,t,prevMonth());const pv=prevOkeYeon(nm,t);if(pv){const bits=[];if(pp.counts.oke)bits.push('오케 '+pp.counts.oke+'회');if(pp.counts.yeon)bits.push('연습실 '+pp.counts.yeon+'시간');cell+='<div class="sub" style="color:#0e7a66">'+prevMonth()+'월 '+bits.join(', ')+' → 이번달 청구 '+fmt(pv)+'원</div>';}}
    if(mm.memo)cell+='<div class="sub" style="color:#b5532a">비고: '+mm.memo+'</div>';
    const dl=[];if(mm.dateP)dl.push('개인 '+mm.dateP);if(mm.dateH)dl.push('합주 '+mm.dateH);
    const dcell=dl.length?dl.join('<br>'):'—';
    rows.push('<tr><td>'+nm+(others.length?' <span style="color:#b5532a;font-size:10px">(+'+others.join('/')+')</span>':'')+'</td><td>'+cell+'</td><td class="dcol">'+dcell+'</td>'+(showAmt?'<td class="num">'+fmt(amt)+'</td>':'')+'</tr>');});
  if(isPay&&extra){rows.push('<tr><td>🎻 오케스트라 지도비</td><td>선생님 추가 지급</td><td class="dcol">—</td><td class="num">'+fmt(extra)+'</td></tr>');total+=extra;}
  const amtHead=isPay?'6:4 지급(60%)':'';
  const cap=isPay?(mn+'월 · 지난달 정산 (6:4 + 지도비) &nbsp;|&nbsp; 합계 '+fmt(total)+'원'):(mn+'월 · 이번달 레슨 기록 (날짜·내역)');
  const head='<tr><th>학생</th><th>레슨 내역</th><th class="dcol">레슨 날짜</th>'+(showAmt?'<th class="num">'+amtHead+'</th>':'')+'</tr>';
  const ncol=showAmt?4:3;
  const body=rows.join('')||'<tr><td colspan="'+ncol+'" style="text-align:center;color:#999">입력된 내역 없음</td></tr>';
  return '<h3>'+cap+'</h3><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';}
function savePDF(){const t=curTeacher;const pm=prevMonth();const bm=billMonth;
  const head='<h2>'+t+' 선생님 정산표</h2><div class="pmeta">'+YEAR+'년 '+pm+'월 ~ '+bm+'월 · 총 '+studentsOf(t).length+'명</div>';
  const oke=okepay[t+'|'+pm]||0;
  const html=head+pdfSection(t,pm,'pay',oke)+'<div class="pagebreak">'+pdfSection(t,bm,'bill')+'</div>'+
    '<div class="foot">레슨 정산 입력 · '+new Date().toLocaleDateString('ko-KR')+' 생성 · 지난달=6:4+지도비 / 이번달=레슨 기록(날짜·내역)</div>';
  document.getElementById('printArea').innerHTML=html;
  const oldTitle=document.title;document.title=t+'_'+pm+'-'+bm+'월';
  window.print();
  setTimeout(()=>{document.title=oldTitle;},500);}


function isMobile(){return window.matchMedia('(max-width:800px)').matches;}
let mobV='list';
function applyMobNav(v){const nl=document.getElementById('navList'),ne=document.getElementById('navEdit');if(nl&&ne){nl.classList.toggle('on',v==='list');ne.classList.toggle('on',v==='edit');}}
function mobView(v){mobV=v;document.body.classList.remove('view-list','view-edit');document.body.classList.add('view-'+v);applyMobNav(v);}
let wasMobile=null;
function initMobile(){const m=isMobile();if(m===wasMobile)return;wasMobile=m;if(m){document.body.classList.remove('view-list','view-edit');document.body.classList.add('view-'+mobV);applyMobNav(mobV);}else{document.body.classList.remove('view-list','view-edit');}}
window.addEventListener('resize',initMobile);
